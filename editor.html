<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor — Tapigro Boeken</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/editor.css">
  
  
  <link rel="icon" href="assets/logo-tapigro.png">
  <link rel="stylesheet" href="demo/demo.css">
  <script src="i18n/nl.js"></script>
  <script src="demo/shared.js"></script>
  <script src="data/catalog.js"></script>
  <script src="demo/urls.js"></script>
  <script src="demo/backend.js"></script>
  <script src="demo/demo.js"></script>
</head>
<body data-page="editor">
  <div id="app">
    
    <aside id="menu">
      <a class="logo" href="index.html" title="Tapigro Boeken — dashboard">
        <img src="assets/logo-tapigro.png" alt="Tapigro" class="logo-img">
        <span class="logo-txt">Boeken<small>catalogi &amp; etiketten</small></span>
      </a>
      <nav>
        <a href="index.html" class="" title="Dashboard"><span class="ico">🏠</span><span class="lbl">Dashboard</span></a>
        <a href="products.html" class="" title="Producten"><span class="ico">📦</span><span class="lbl">Producten</span></a>
        <a href="books.html" class="on" title="Boeken"><span class="ico">📚</span><span class="lbl">Boeken</span></a>
        
        <a href="imports.html" class="" title="Importeren"><span class="ico">⬆️</span><span class="lbl">Importeren</span></a>
        <a href="users.html" class="" title="Gebruikers"><span class="ico">👤</span><span class="lbl">Gebruikers</span></a>
        
      </nav>
      <div class="qui">
        <span class="qui-nom">Demo</span>
        <span class="qui-role">Beheerder</span>
        <button id="logout-btn" type="button" class="lien" title="Afmelden"><span class="ico" aria-hidden="true">⏻</span><span class="lbl">Afmelden</span></button>
        
        <span class="langues" role="group" aria-label="Taal van de toepassing">
          <button type="button" class="lien lang-btn on" data-lang="nl" lang="nl" aria-pressed="true">NL</button><button type="button" class="lien lang-btn" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
        </span>
      </div>
    </aside>
    
    <main class="container">
      <div id="flash" aria-live="polite"></div>
      <div id="editor-root" class="editor" data-book-id="0">
  <div class="editor-main">
    <div class="editor-toolbar">
      <a class="back-link" href="books.html">← Boeken</a>
      <input id="book-name" type="text" maxlength="200" aria-label="Naam van het boek">
      <label id="fixed-pages-setting" class="fixed-setting" hidden
             title="De vaste pagina’s van dit boek toevoegen of weghalen (de teksten blijven bewaard)">
        <input id="fixed-pages-toggle" type="checkbox"> Omslag, pagina 2 en achterkant
      </label>
      <span id="save-status" class="save-status is-saved" role="status">Opgeslagen</span>
      <button id="save-btn" type="button" class="btn sec petit">Opslaan</button>
      <a id="pdf-link" class="btn petit" href="pdf.html?id=0">Exporteren als PDF</a>
    </div>
    <p id="editor-error" class="error" hidden></p>
    <div id="spreads" class="spreads" aria-label="Pagina’s van het boek"></div>
  </div>
  <aside class="product-panel" id="product-panel" aria-label="Producten">
    <div class="panel-filters">
      <input id="prod-search" type="search" placeholder="Productcode of naam zoeken…" aria-label="Product zoeken">
      <select id="prod-category" aria-label="Filter op categorie"><option value="">Alle categorieën</option></select>
      <select id="prod-group" aria-label="Filter op productgroep"><option value="">Alle productgroepen</option></select>
    </div>
    <div id="prod-count" class="prod-count"></div>
    <div id="prod-list" class="prod-list"></div>
    <button id="prod-more" type="button" class="btn sec petit" hidden>Meer producten tonen</button>
  </aside>
</div>
<script src="vendor/sortable.min.js" defer></script>
<script src="js/layout-render.js" defer></script>
<script src="js/editor/autosave.js" defer></script>
<script src="js/editor/title-follow.js" defer></script>
<script src="js/editor/scroll-anchor.js" defer></script>
<script src="js/editor/dragdrop.js" defer></script>
<script src="js/editor/editor.js" defer></script>

    </main>
  </div>

  
  <dialog id="confirmation" class="modale" aria-labelledby="confirmation-titre">
    <h2 id="confirmation-titre">Weet u het zeker?</h2>
    <p id="confirmation-texte"></p>
    <div class="actions">
      <button type="button" class="btn sec" data-reponse="non" autofocus>Nee, annuleren</button>
      <button type="button" class="btn" data-reponse="oui">Ja</button>
    </div>
  </dialog>

  
  <dialog id="saisie" class="modale" aria-labelledby="saisie-titre">
    <form id="saisie-form" method="dialog" autocomplete="off">
      <h2 id="saisie-titre"></h2>
      <label id="saisie-label" for="saisie-champ"></label>
      <input id="saisie-champ" type="text" maxlength="200">
      <div class="actions">
        <button type="button" class="btn sec" data-reponse="non">Annuleren</button>
        <button type="submit" class="btn" data-reponse="oui">Bevestigen</button>
      </div>
    </form>
  </dialog>

  
  <script src="js/common.js"></script>
</body>
</html>
